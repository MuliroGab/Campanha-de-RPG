<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crônicas da Campanha</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>

    <header>

        <div class="logo">

            <img src="imagens/logo.png" alt="Logo da Campanha">

            <h1>Crônicas da Campanha</h1>

        </div>

        <nav>

            <a href="#inicio">Início</a>
            <a href="#personagens">Personagens</a>
            <a href="#sessoes">Sessões</a>
            <a href="#galeria">Galeria</a>
            <a href="#mapas">Mapas</a>
            <a href="#videos">Vídeos</a>

        </nav>

    </header>

    <main>

        <!-- HERO -->

        <section id="inicio">

            <div class="hero">

                <img src="imagens/logo.png" alt="Logo" class="hero-logo">

                <h2>Crônicas da Campanha</h2>

                <p class="frase">
                    "Toda lenda começa com um pequeno grupo de aventureiros."
                </p>

                <a href="#personagens" class="btn">
                    Iniciar Jornada
                </a>

            </div>

            <div class="scroll">

                ▼

            </div>

        </section>

        <!-- PERSONAGENS -->

        <section id="personagens">

            <div class="container">

                <h2>Personagens</h2>

                <div class="cards">

                </div>

            </div>

        </section>

        <!-- SESSÕES -->

        <section id="sessoes">

            <div class="container">

                <h2>Sessões</h2>

                <div class="cards">

                </div>

            </div>

        </section>

        <!-- GALERIA -->

        <section id="galeria">

            <div class="container">

                <h2>Galeria</h2>

                <div class="galeria">

                </div>

            </div>

        </section>

        <!-- MAPAS -->

        <section id="mapas">

            <div class="container">

                <h2>Mapas</h2>

                <div class="cards">

                </div>

            </div>

        </section>

        <!-- VÍDEOS -->

        <section id="videos">

            <div class="container">

                <h2>Vídeos</h2>

                <div class="cards">

                </div>

            </div>

        </section>

    </main>

    <footer>

        <p>© 2026 - Crônicas da Campanha</p>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
